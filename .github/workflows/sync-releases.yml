name: Sync releases from GitHub

# Refreshes version + published_at for every asset already listed in
# data/assets.yaml from its GitHub release. Does NOT add new assets —
# new repos must be added manually (one-time YAML edit) so we control
# title, description, tags, visibility, slug, featured flag.

on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC (~07:30 IST)
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Refresh release dates from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          changed=0
          count=$(yq '.assets | length' data/assets.yaml)

          for i in $(seq 0 $((count-1))); do
            slug=$(yq ".assets[$i].repo" data/assets.yaml \
              | sed -E 's|^https?://github.com/||; s|\.git$||; s|^"||; s|"$||')
            if [ -z "$slug" ] || [ "$slug" = "null" ]; then continue; fi

            json=$(gh api "repos/$slug/releases/latest" 2>/dev/null || echo "")
            if [ -z "$json" ]; then
              echo "-> $slug  (no releases yet)"
              continue
            fi

            tag=$(echo "$json" | jq -r '.tag_name // ""' | sed 's/^v//')
            pub=$(echo "$json" | jq -r '.published_at // ""' | cut -d'T' -f1)
            if [ -z "$tag" ] || [ -z "$pub" ]; then continue; fi

            cv=$(yq ".assets[$i].version" data/assets.yaml)
            cd=$(yq ".assets[$i].date"    data/assets.yaml)
            if [ "$cv" != "$tag" ] || [ "$cd" != "$pub" ]; then
              yq -i ".assets[$i].version = \"$tag\"" data/assets.yaml
              yq -i ".assets[$i].date    = \"$pub\"" data/assets.yaml
              echo "-> $slug  updated v$tag . $pub  (was v$cv . $cd)"
              changed=1
            else
              echo "-> $slug  up to date (v$tag . $pub)"
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name  "release-sync-bot"
          git config user.email "release-sync-bot@users.noreply.github.com"
          git add data/assets.yaml
          git commit -m "chore: sync releases from GitHub [skip ci]"
          git push
